name: Refresh mission control dashboard

on:
  schedule:
    - cron: "30 0 * * *" # daily, just after midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/mission-control.template.svg"
      - "scripts/update_dashboard.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild dashboard SVG
        env:
          # PROFILE_TOKEN: fine-grained PAT (metadata read on all repos) so
          # private repos are counted. Falls back to public-only without it.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_dashboard.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet assets/mission-control.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/mission-control.svg
            git commit -m "chore: refresh mission control telemetry"
            git push
          else
            echo "No telemetry changes."
          fi
