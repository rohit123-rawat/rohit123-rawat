<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="See you in orbit — rocket launching">
<defs>
<linearGradient id="meteorTail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-90" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
  <stop offset="0.35" stop-color="#7DF9FF" stop-opacity="0.5"/>
  <stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/>
</linearGradient>
<filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="9" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<radialGradient id="ftBg" cx="50%" cy="0%" r="110%">
  <stop offset="0" stop-color="#0E1533"/>
  <stop offset="1" stop-color="#030614"/>
</radialGradient>
<linearGradient id="planetG2" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4C1D95"/>
  <stop offset="0.45" stop-color="#37136E"/>
  <stop offset="1" stop-color="#160A38"/>
</linearGradient>
<linearGradient id="byeGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#7DF9FF"/>
  <stop offset="0.5" stop-color="#E0E7FF"/>
  <stop offset="1" stop-color="#A78BFA"/>
</linearGradient>
<linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF"/>
  <stop offset="0.35" stop-color="#FBBF24"/>
  <stop offset="1" stop-color="#F97316" stop-opacity="0.1"/>
</linearGradient>
<clipPath id="ftClip"><rect x="0" y="0" width="900" height="300" rx="16"/></clipPath>
</defs>
<rect x="0" y="0" width="900" height="300" rx="16" fill="url(#ftBg)"/>
