<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" role="img" aria-label="GitHub statistics dashboard">
<defs>
<linearGradient id="meteorTail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-90" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
  <stop offset="0.35" stop-color="#7DF9FF" stop-opacity="0.5"/>
  <stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/>
</linearGradient>
<filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="9" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

