<svg xmlns="http://www.w3.org/2000/svg" width="900" height="264" viewBox="0 0 900 264" role="img" aria-label="GitHub contribution streak">
<defs>
<linearGradient id="meteorTail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-90" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
  <stop offset="0.35" stop-color="#7DF9FF" stop-opacity="0.5"/>
  <stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/>
</linearGradient>
<filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="9" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
  <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.06"/>
  <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
</linearGradient>
<linearGradient id="cometTail" gradientUnits="userSpaceOnUse" x1="492" y1="112" x2="475.9" y2="78.9">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
  <stop offset="0.3" stop-color="#7DF9FF" stop-opacity="0.55"/>
  <stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="trailLine" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="850" y2="0">
  <stop offset="0" stop-color="#A78BFA" stop-opacity="0.15"/>
  <stop offset="1" stop-color="#7DF9FF" stop-opacity="0.45"/>
</linearGradient>
<clipPath id="skClip"><rect x="0" y="0" width="900" height="264" rx="16"/></clipPath>
</defs>
<rect x="0" y="0" width="900" height="264" rx="16" fill="#0A0F24"/>
